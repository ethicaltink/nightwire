[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightwire"
version = "0.1.0"
description = "LAN-only network video recorder for ONVIF cameras"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Each is imported lazily so a missing one degrades one feature
    # instead of stopping the app from starting.
    "onvif-zeep-async>=3.1",   # ONVIF: device info, media profiles, events
    "WSDiscovery>=2.0",        # WS-Discovery multicast camera discovery
    "cryptography>=43.0",      # Fernet, for camera passwords at rest
    "httpx>=0.27",             # snapshot fetch with HTTP digest auth
    "PyYAML>=6.0",             # optional /config/config.yaml seeding
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nightwire = ["migrations/*.sql", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
