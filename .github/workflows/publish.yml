# Build and publish the image to GHCR.
#
# Runs the tests first: a tagged image that fails its own suite is worse than
# no image, because it looks deployable.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        # The recorder and export integration tests record and cut real
        # video; without ffmpeg they skip and prove nothing.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install
        run: pip install -e '.[dev]'

      - name: Python tests
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript tests
        working-directory: frontend
        run: npm install --no-fund --no-audit && npm test

      - name: Frontend builds
        working-directory: frontend
        run: npm run build

      - name: Alert rules are valid
        # promtool checks the rule syntax and that the expressions parse.
        run: |
          curl -sSL -o /tmp/prom.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v3.1.0/prometheus-3.1.0.linux-amd64.tar.gz
          tar -xzf /tmp/prom.tar.gz -C /tmp
          /tmp/prometheus-3.1.0.linux-amd64/promtool check rules deploy/alerts.yml

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
